name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: feedbrain
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: feedbrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedbrain -d feedbrain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://feedbrain:ci-only-password@localhost:5432/feedbrain
      LOG_LEVEL: INFO
      RUN_DB_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrate up
        run: alembic upgrade head
      # Verify rollback only while the disposable database is still empty.
      # Revision 0008 deliberately refuses to invent executor identity for
      # anonymous external ActionRuns created by integration tests.
      - name: Verify empty-database schema downgrade
        run: alembic downgrade base
      - name: Reapply migrations before data-writing tests
        run: alembic upgrade head
      - name: Real database readiness smoke
        run: python -c "from fastapi.testclient import TestClient; from info_hub.main import app; response = TestClient(app).get('/health/ready'); assert response.status_code == 200, response.text"
      - name: Test
        run: pytest -q
