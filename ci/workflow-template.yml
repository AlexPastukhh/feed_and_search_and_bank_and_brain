name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: feedbrain
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: feedbrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedbrain -d feedbrain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://feedbrain:ci-only-password@localhost:5432/feedbrain
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrate up
        run: alembic upgrade head
      - name: Real database readiness smoke
        run: python -c "from fastapi.testclient import TestClient; from info_hub.main import app; response = TestClient(app).get('/health/ready'); assert response.status_code == 200, response.text"
      - name: Test
        run: pytest -q
      - name: Migrate down
        run: alembic downgrade base
