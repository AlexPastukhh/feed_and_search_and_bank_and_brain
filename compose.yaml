name: feedbrain

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-feedbrain}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-feedbrain}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ACTION_FEEDBRAIN_URL: ${ACTION_FEEDBRAIN_URL:-http://api:8000}

x-app-image: &app-image
  build: .
  image: feedbrain-app:local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feedbrain}
      POSTGRES_DB: ${POSTGRES_DB:-feedbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *app-image
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-image
    command: ["uvicorn", "info_hub.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # Unlike /health/live, /health/ready verifies PostgreSQL access.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  action-core-gw:
    <<: *app-image
    profiles: ["gateway"]
    command: ["python", "-m", "info_hub.gateway_https_server"]
    environment:
      <<: *app-env
      ACTION_GATEWAY_READ_TOKEN_SHA256: ${ACTION_GATEWAY_READ_TOKEN_SHA256:-}
    volumes:
      - type: volume
        source: action_core_gateway_tls
        target: /run/action-core-gateway-tls
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "443"
    networks:
      - default
      - fortis-actioncore-net
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    restart: unless-stopped

  worker:
    <<: *app-image
    command: ["python", "-m", "info_hub.worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  action-worker:
    <<: *app-image
    command: ["python", "-m", "info_hub.action_worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  action_core_gateway_tls:
    external: true
    name: fortis-actioncore-gateway-tls

networks:
  fortis-actioncore-net:
    name: fortis-actioncore-net
    driver: bridge
    internal: true
