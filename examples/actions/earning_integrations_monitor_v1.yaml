name: Мониторинг оплачиваемых проектов на интеграции и автоматизацию
category: monitoring
instruction: |
  НАЗНАЧЕНИЕ
  Наблюдай за конкретными оплачиваемыми запросами на API/CRM-интеграции,
  автоматизацию процессов, исправление существующих интеграций,
  AI-функции в приложениях и близкие инженерные задачи.
  Выдавай полезные находки с проверяемыми первоисточниками и изменениями
  относительно предыдущего результата. Это MONITORING по назначению;
  внешний AI вправе выполнять инструкцию сам, использовать разрешённые
  Tools либо сочетать способы. Workflow и расписание необязательны.

  КОНТЕКСТ И ВЫБОР
  - Подтверждены навыки программирования, включая .NET и React.
    Не приписывай опыт с n8n, GoHighLevel, Zoho, AWS, Python или портфолио
    без доказательств; необходимость освоения помечай отдельно.
  - Всемирный поиск без ограничения оплаты; в приоритете разовые проекты
    с понятным результатом. Долгосрочные запросы рассматривай отдельно.
  - По умолчанию изучай недавние публично доступные проекты за 14 дней;
    если результатов мало, можно расширить до 30, указав фактический охват.
    Квот, минимальной оплаты и обязательного числа объявлений нет.
  - Источник выбирается по доступности и правам, не по жёсткой привязке
    к одному провайдеру. На первом запуске допускается публичный веб-поиск
    и доступные страницы площадок. Saved Searches при наличии разрешённого
    аккаунта — опция. Нельзя считать API Freelancer.com, Upwork RSS,
    подписки или автоматизированный парсер уже подключёнными.
  - Пользователь может уточнять источники, период, фильтры и приоритеты
    при каждом ручном выполнении; не выдумывай технические параметры Core.

  СПОСОБ ИСПОЛНЕНИЯ
  1. Перед поиском прочитай точную версию Action, вопрос, ограничения,
     доступные разрешённые инструменты и предыдущий сохранённый результат,
     если путь чтения существует. Отметь дату и режим исполнения.
  2. Ищи оплачиваемые запросы по связкам API integration, CRM, webhooks,
     workflow automation, .NET/React и исправлению AI-enabled приложений.
     Проверяй реальную задачу, требования, условия, срок и бюджет,
     если они опубликованы; не смешивай косвенный спрос с доступным заказом.
  3. Используй прямые публичные страницы там, где возможно. Если доступно
     только поисковое представление, отмечай proof_level=search_only,
     а не direct_verified; если ресурс недоступен — так и пиши.
     Относительное Published/Posted сверяй с датой наблюдения,
     сохраняя неопределённость.
  4. Отделяй реально короткие задачи от широких проектов под маленький
     бюджет. Оцени соответствие навыкам, необходимость обучения,
     конкуренцию, географические ограничения и неизвестный объём.
     Не называй задачу безопасно выполнимой по одному только заголовку.
  5. Для повторного запуска используй пару платформа+ID объявления или
     канонический URL; отдельно показывай новые, ранее виденные,
     подтверждённо изменённые и недоступные для сравнения.
     Если предыдущего отчёта нет — baseline_only, без ложных изменений.
     Число найденных карточек не является статистикой рынка.
  6. Не входи в чужие аккаунты, не обходи paywall/anti-bot, не храни
     чужие приватные данные, не применяй закрытые API без разрешений,
     не откликайся и не создавай внешних обязательств.

  КОНТРАКТ РЕЗУЛЬТАТА
  Объяви в каждом результате:
  - metadata: action_id/version, run_key, время, охват, источники,
    режим external_ai_manual или проверенный другой режим, previous_run_ref.
  - findings: список полезных ссылок (может быть пустым), локальный
    ID FIND-001..., platform, listing_url/listing_id, краткая задача,
    опубликованная оплата+валюта либо unknown, тип проекта, дата
    публикации либо unknown, proof_level, status/availability либо unknown,
    релевантность, существенные риски и evidence IDs.
  - changes: baseline_only или сравнение с previous_run_ref по URL/ID;
    не объявляй новый поиск доказательством новизны предложения.
  - overview: повторяющиеся потребности, ограничения отбора, что стоит
    проверить или проигнорировать, неопределённость и следующие решения.
  - evidence: EV-001..., URL, дата проверки, что установлено, ограничения.
  При отсутствии находок возвращай findings=[], reasons и ограничения.
  Не заполняй поля фиктивными значениями.

  СОХРАНЕНИЕ И ПОВТОРНОЕ ЧТЕНИЕ
  Для ручной проверки используй проверенный, разрешённый внешний Tool
  записи: локальный task worktree репозитория через Fortis Gateway.
  Ориентир: docs/monitoring/action-<id>/runs/<YYYY-MM-DD>-<run-key>/
  с согласованными result.json и report.md; индекс для поиска отчёта.
  До PR/merge не утверждай, что файлы сохранены в main.
  Если сохранение недоступно, честно сообщи not_saved и предоставь
  результат без выдуманного URL. Не превращай ручное исполнение AI
  в ActionRun/StepRun Core и не запускай Scheduler без разрешения.
  В чате достаточно короткого резюме и проверяемой ссылки на архив
  там, где публикация подтверждена.
